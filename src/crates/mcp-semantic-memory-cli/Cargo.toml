[package]
name = "mcp-semantic-memory-cli"
version = "0.1.1"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "mcp-semantic-memory"
path = "src/main.rs"

[features]
default = ["sqlite", "postgres", "mariadb", "native-tls"]
sqlite = ["dep:mcp-semantic-memory-sqlite"]
postgres = ["dep:mcp-semantic-memory-postgres"]
mariadb = ["dep:mcp-semantic-memory-mariadb"]
native-tls = [
  "mcp-semantic-memory/native-tls",
  "mcp-semantic-memory-postgres?/native-tls",
  "mcp-semantic-memory-mariadb?/native-tls",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
mcp-semantic-memory.workspace = true
mcp-semantic-memory-mariadb = { workspace = true, optional = true }
mcp-semantic-memory-postgres = { workspace = true, optional = true }
mcp-semantic-memory-sqlite = { workspace = true, optional = true }
rmcp = { version = "3", features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
async-trait = "0.1"
rmcp = { version = "3", features = ["client"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
