[package]
name = "mcp-semantic-memory-testing"
version = "0.1.0"
description = "Test support for the mcp-semantic-memory stores"
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
containers = [
  "dep:bollard",
  "dep:testcontainers",
  "dep:tokio",
  "dep:tokio-util",
]

[dependencies]
async-trait = "0.1"
bollard = { version = "0.21", optional = true, default-features = false, features = [
  "pipe",
] }
futures-util = "0.3"
mcp-semantic-memory.workspace = true
serde_json = "1"
# NOTE: the default feature of testcontainers is a TLS provider for talking
# to a remote container runtime, and this one is reached over a unix socket
testcontainers = { version = "0.28", optional = true, default-features = false }
tokio = { version = "1", optional = true, features = ["fs"] }
tokio-util = { version = "0.7", optional = true, features = ["io"] }
