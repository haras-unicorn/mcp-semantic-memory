[package]
name = "mcp-semantic-memory-sqlite"
version = "0.1.2"
description.workspace = true
repository.workspace = true
authors.workspace = true
license.workspace = true
readme.workspace = true
edition.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
async-trait = "0.1"
chrono = "0.4"
libsqlite3-sys = "0.37"
mcp-semantic-memory.workspace = true
serde_json = "1"
sqlite-vec = "0.1"
sqlx = { version = "0.9", default-features = false, features = [
  "runtime-tokio",
  "chrono",
  "migrate",
  "macros",
  "sqlite",
] }

[dev-dependencies]
mcp-semantic-memory-testing.workspace = true
tokio = { version = "1", features = ["macros", "rt"] }
